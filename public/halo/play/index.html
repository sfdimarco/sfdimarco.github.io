  // if the first live planet that way is a team-mate, that side is quiet.
  const dir = lane === 0 ? -1 : 1, N = 7;

  return [];
}

function legal(S) {
  if (S.result) return [];
  if (S.pending) { const o = [{ t: 'pass' }]; return o.concat(bigOptions(S, S.players[S.pending.responder]).filter(b => b.tp === S.pending.from).map(b => Object.assign({}, b, { t: 'answer' }))); }
  const p = S.players[S.cur], o = [];
  const peace = S.turnNo <= S.cfg.peace * S.players.length;
  const empty = p.grid.map((c, i) => c ? -1 : i).filter(i => i >= 0);
  for (const id of new Set(p.hand)) {
    const cd = C[id]; if (costOf(S, id) > p.econ) continue;
    if (cd.type === 'action') {
      if (peace && (cd.fx === 'barrage' || cd.fx === 'takeover' || cd.fx === 'pollen' || cd.fx === 'siege' || cd.fx === 'smash')) continue;
      if (cd.fx === 'absorb') o.push({ t: 'play', card: id });
      if (cd.fx === 'seed' && !p.rings[FOOD] && FOOD < S.cfg.rings) o.push({ t: 'play', card: id });   // 🗣 11-22 night (his pick B): a Food-only relight
      if ((cd.fx === 'snooze' || cd.fx === 'spring' || cd.fx === 'sprout') && p.rings.some((on, k) => !on && k < S.cfg.rings)) o.push({ t: 'play', card: id });
      if (cd.fx === 'smash') for (const q of enemies(S, p)) if (!capped(S, q)) o.push({ t: 'play', card: id, tp: q.id });
      if (cd.fx === 'siege') for (const q of enemies(S, p)) for (let l = 0; l < 3; l++) { const f = front(q, l); if (f && !q.pink && !f.cell.down && Dof(f.cell) >= S.cfg.siegeD) o.push({ t: 'play', card: id, tp: q.id, lane: l }); }
      if (cd.fx === 'gain3' || cd.fx === 'gain2') o.push({ t: 'play', card: id });
      if (cd.fx === 'barrage') for (const q of enemies(S, p)) for (let l = 0; l < 3; l++) { const f = front(q, l); if (f && !q.pink && Dof(f.cell) <= S.cfg.barrageD) o.push({ t: 'play', card: id, tp: q.id, lane: l }); }
      if (cd.fx === 'envoy' && !peace) for (const q of enemies(S, p)) if (!(p.seals || []).includes(q.id)) o.push({ t: 'play', card: id, tp: q.id });   // not in the peace round: the rival must get a turn to answer
      if (cd.fx === 'sigil') { if (!peace) for (const q of enemies(S, p)) if (q.rings[RELIGION] && !capped(S, q)) o.push({ t: 'play', card: id, tp: q.id }); }
      if (cd.fx === 'takeover') for (const q of enemies(S, p)) if (q.rings[0] && !capped(S, q)) o.push({ t: 'play', card: id, tp: q.id });
      if (cd.fx === 'pollen') for (const q of enemies(S, p)) if (!capped(S, q)) q.rings.forEach((on, k) => { if (on) o.push({ t: 'play', card: id, tp: q.id, ring: k }); });
      if (cd.fx === 'relight') for (const q of S.players) if (q.team === p.team && (!q.out || q.cmd.where !== 'out')) q.rings.forEach((on, k) => { if (!on && k < S.cfg.rings) o.push({ t: 'play', card: id, tp: q.id, ring: k }); });
    } else { for (const sq of empty) o.push({ t: 'play', card: id, sq });
      // 11-22: a machine piece may be BUILT OVER one of your own cards (the nine squares are otherwise full long before the machine is)
      if (S.cfg.techWin && S.cfg.lib && (cd.tags.includes('part') || cd.tags.includes('core'))) p.grid.forEach((c, sq) => { if (c && !c.isCmd && !machine(c)) o.push({ t: 'play', card: id, sq }); }); }
  }
  if (p.cmd.where === 'shoulder') for (const sq of empty) o.push({ t: 'deploy', sq });
  for (let lane = 0; lane < 3 && !peace; lane++) {

    const tgs = targets(S, p, lane, card(f.cell).tags.includes('anylane'));
    if (card(f.cell).tags.includes('runner')) for (const q of enemies(S, p)) if (q.parlay !== p.id) for (let l = 0; l < 3; l++) if (!front(q, l) && !tgs.some(t => t.tp === q.id && t.lane === l)) tgs.push({ tp: q.id, lane: l });   // runner: any EMPTY enemy lane
    for (const tg of tgs) {
      const q = S.players[tg.tp], d = front(q, tg.lane);

  }
  if (S.cfg.econWin && p.econ >= winPrice(S, p) && ringOK(S, p, ECONOMY)) o.push({ t: 'buywin' });
  if (!peace) p.grid.forEach((c, sq) => { if (c && card(c).move === 'smite' && (c.charge || 0) >= 2 && !c.attacked) for (const q of enemies(S, p)) if (!capped(S, q)) q.rings.forEach((on, k) => { if (on) o.push({ t: 'smite', sq, tp: q.id, ring: k }); }); });
  if (!peace) for (const b of bigOptions(S, p)) o.push(b);
  if (!S.offer) o.push({ t: 'offer' });
  else if (S.offer.from !== p.id && S.players[S.offer.from].team !== p.team && !S.offer.yes.includes(p.id)) o.push({ t: 'accept' });
  o.push({ t: 'end' });
  return o;
}

function bigOptions(S, p) {
  const o = []; if (p.out || p.cmd.used || p.cmd.where === 'out') return o;
  const big = C[p.cmd.id].big, en = enemies(S, p);
  const count = tag => p.grid.filter(c => c && card(c).tags.includes(tag)).length;
  if (big === 'broadside' && count('ship')) for (const q of en) if (!capped(S, q)) q.rings.forEach((on, k) => { if (on) o.push({ t: 'big', big, tp: q.id, ring: k }); });
  if (big === 'audit' && count('auditor')) for (const q of en) if (!capped(S, q)) o.push({ t: 'big', big, tp: q.id });
  if (big === 'canopy' || big === 'holyleague' || big === 'moodpink') o.push({ t: 'big', big });
  if (big === 'parlay') for (const q of en) o.push({ t: 'big', big, tp: q.id });
  if (big === 'multiply') p.grid.forEach((c, sq) => { const r = sq - sq % 3; if (c && !c.isCmd && !c.down && [r, r + 1, r + 2].some(i => !p.grid[i])) o.push({ t: 'big', big, sq }); });
  return o;
}

// a rival that really HURTS a planet it has a treaty with (a ring put out, a card knocked out) tears the treaty up
function tear(S, p) { const a = S.players[S.cur]; if (a && a.team !== p.team && (p.seals || []).includes(a.id)) { p.seals = p.seals.filter(i => i !== a.id); say(S, `${a.name} tears up the treaty with ${p.name}`); } }
function knock(S, p, sq) { // a card leaves the table
  const c = p.grid[sq]; p.grid[sq] = null; if (!c) return; tear(S, p);
  if (!c.isCmd && S.cfg.reshuffle && !C[c.card].tags.includes('anylane-fused')) (p.discard = p.discard || []).push(c.card);
  if (c.isCmd) { p.cmd.where = 'out'; say(S, `${p.name}'s commander ${C[c.card].name} is knocked out: ${p.name} is OUT`); putOut(S, p); } // MOOK: lose your commander, you are out
}
function putOut(S, p) { if (p.out) return; p.out = true; p.grid.fill(null); if (p.cmd.where === 'grid') p.cmd.where = 'shoulder'; } // a planet gone dark sends its commander back to the shoulder (found in playtest 1)
function dark(S, p, k, why) {
  if (p.canopy) { say(S, `${p.name}'s canopy holds (${why})`); return false; }
  if (!p.rings[k]) return false;
  if (capped(S, p)) { say(S, `${p.name}'s halo holds: ${S.cfg.ringCap} rings is all it can lose before its next turn (${why})`); return false; }
  const tr = p.grid.findIndex(c => c && c.down && card(c).trig === 'ringdark');
  if (tr >= 0) { const a = S.players[S.cur]; p.grid[tr] = null; say(S, `${p.name}'s face-down card flips: BRUMATION. Snow. The ${RINGS[k]} ring stays lit (${why})`);
    if (a.team !== p.team) for (let l = 0; l < 3; l++) { const f = front(a, l); if (f) f.cell.frozen = 2; } return false; }
  p.rings[k] = false; p.lost = (p.lost || 0) + 1; say(S, `${p.name}'s ${RINGS[k]} ring goes dark (${why})`); tear(S, p);
  if (!S.stats.firstBlood) S.stats.firstBlood = S.players[S.cur].team;
  if (S.cfg.spoils) { const a = S.players[S.cur]; if (a.team !== p.team && !a.out) {
    if (S.cfg.spoils === 'econ') a.econ++;
    else if (!S.cfg.handCap || a.hand.length < S.cfg.handCap) { if (!a.deck.length && S.cfg.reshuffle && a.discard && a.discard.length) { a.deck = shuffle(a.discard, S.r); a.discard = []; } if (a.deck.length) a.hand.push(a.deck.pop()); } } }

  return true;
}
// v1: a move that goes past the grid. A face-down trap that says "past the grid" stops all of it (call C).
function past(S, q, rings, why) {
  const tr = q.grid.findIndex(c => c && c.down && card(c).trig === 'pastgrid');
  if (tr >= 0) { say(S, `${q.name}'s face-down card flips: ${card(q.grid[tr]).name} stops ${why}`); q.grid[tr] = null; return; }

}
function trapHit(S, p, q, d, cells) {   // an attack lands on a face-down card
  const t = card(d.cell);
  if (t.trig === 'attacked') { say(S, `${q.name}'s face-down card flips: ${t.name}. What attacked falls in`); q.grid[d.sq] = null; for (const f of cells) knock(S, p, f.sq); }
  else { say(S, `${q.name}'s face-down ${t.name} is knocked out before its moment`); q.grid[d.sq] = null; }
}
function auditRings(S, p, q) { const n = Math.min(S.cfg.auditCap, p.grid.filter(c => c && card(c).tags.includes('auditor')).length); return q.rings.map((on, k) => on ? k : -1).filter(k => k >= 0).slice(0, n); }
function bigDamage(S, p, a) { const q = S.players[a.tp]; return a.big === 'broadside' ? [a.ring] : a.big === 'audit' ? auditRings(S, p, q) : []; }

function checkCombos(S, p) {
  const L = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
  for (const co of COMBOS) for (const l of L) {
    if (co.lib && !S.cfg.lib) continue;
    const ids = l.map(i => p.grid[i] && !p.grid[i].down && baseId(p.grid[i].card)); if (ids.includes(null) || ids.includes(undefined)) continue;
    if (co.parts.every(x => ids.includes(x))) { l.forEach(i => p.grid[i] = null); p.grid[l[1]] = { uid: S.uid++, card: co.makes, attacked: true }; say(S, `${p.name}: three in a row fuse into ${C[co.makes].name}`); }
  }
}

function sameAction(a, b) { const ka = Object.keys(a), kb = Object.keys(b); return ka.length === kb.length && ka.every(k => a[k] === b[k]); }

function apply(S, a) {
  const ok = legal(S).find(x => sameAction(x, a)); if (!ok) throw new Error('illegal move ' + JSON.stringify(a));
  if (S.pending) return resolveClash(S, a);
  const p = S.players[S.cur];
  if (a.t === 'end') return endTurn(S);
  if (a.t === 'offer') { S.offer = { from: p.id, yes: [] }; say(S, `${p.name} offers a handshake`); return; }
  if (a.t === 'accept') { S.offer.yes.push(p.id); say(S, `${p.name} shakes`);
    if (enemies(S, S.players[S.offer.from]).every(q => S.offer.yes.includes(q.id))) finish(S, { type: 'amiable' }); return; }
  S.active = true;
  if (a.t === 'deploy') { p.grid[a.sq] = { uid: S.uid++, card: p.cmd.id, isCmd: true, attacked: false }; p.cmd.where = 'grid'; say(S, `${p.name} puts ${C[p.cmd.id].name} on the grid`); return; }
  if (a.t === 'play') {
    const cd = C[a.card]; p.hand.splice(p.hand.indexOf(a.card), 1); p.econ -= costOf(S, a.card);
    if (cd.type === 'trap') { p.grid[a.sq] = { uid: S.uid++, card: a.card, attacked: false, down: true }; say(S, `${p.name} sets a card face down`); return; }
    if (cd.type !== 'action') { const old = p.grid[a.sq]; if (old && S.cfg.reshuffle) (p.discard = p.discard || []).push(old.card);
      p.grid[a.sq] = { uid: S.uid++, card: a.card, attacked: false, charge: 0 }; say(S, old ? `${p.name} builds ${cd.name} over ${old.down ? 'a face-down card' : card(old).name}` : `${p.name} plays ${cd.name}`); checkCombos(S, p);
      if (S.cfg.techWin && ringOK(S, p, SCIENCE) && whole(S, p)) {
        if (S.cfg.techHold) { p.whole = true; say(S, `${p.name}'s GREAT MACHINE IS WHOLE: break a piece or put out ${p.name}'s Science ring before ${p.name}'s next turn`); }
        else { say(S, `${p.name}'s great machine is whole`); finish(S, { type: 'win', team: p.team, how: 'tech' }); } }
      return; }
    const q = a.tp !== undefined ? S.players[a.tp] : null;
    if (cd.fx === 'gain3') p.econ += 3; if (cd.fx === 'gain2') p.econ += 2;
    if (cd.fx === 'gain3' || cd.fx === 'gain2') say(S, `${p.name} plays ${cd.name}: +${cd.fx === 'gain3' ? 3 : 2} ECON`);
    if (cd.fx === 'barrage') { const f = front(q, a.lane); say(S, `${p.name}'s Cannon Barrage knocks out ${card(f.cell).name}`); knock(S, q, f.sq); }
    if (cd.fx === 'siege') { const f = front(q, a.lane); say(S, `${p.name}'s SIEGE breaks ${card(f.cell).name}`); knock(S, q, f.sq); }
    if (cd.fx === 'takeover') past(S, q, [0], 'Hostile Takeover');
    if (cd.fx === 'envoy') { (p.seals = p.seals || []).push(q.id); say(S, `${p.name} sends an envoy: a treaty with ${q.name} (${treaties(S, p)} of ${Math.min(enemies(S, p).length, S.cfg.polWin || 99)})`); }
    if (cd.fx === 'sigil') { say(S, `${p.name} raises THE SIGIL over ${q.name}`); past(S, q, [RELIGION], 'The Sigil'); }
    if (cd.fx === 'absorb') { p.canopy = true; say(S, `${p.name} plays ABSORB: a soft cloud over the planet`); }
    if (cd.fx === 'seed') { p.rings[FOOD] = true; say(S, `${p.name} plants a seed: the Food ring relights`); reap(S, p, 1); }
    if (cd.fx === 'snooze' || cd.fx === 'spring' || cd.fx === 'sprout') { const max = cd.fx === 'snooze' ? 5 : cd.fx === 'sprout' ? 1 : 2; let k = 0; if (S.cfg.harvestWin && roadOf(p) === 'food' && !p.rings[FOOD] && FOOD < S.cfg.rings) { p.rings[FOOD] = true; k++; } p.rings.forEach((on, i) => { if (!on && i < S.cfg.rings && k < max) { p.rings[i] = true; k++; } }); reap(S, p, k); say(S, `${p.name} plays ${cd.name}: ${k} ring${k === 1 ? '' : 's'} relight`); }
    if (cd.fx === 'smash') { say(S, `${p.name} plays SMASH on ${q.name}`); past(S, q, q.rings.map((on, k) => on ? k : -1).filter(k => k >= 0).slice(0, 2), 'SMASH'); }
    if (cd.fx === 'pollen') past(S, q, [a.ring], 'The Pollen');
    if (cd.fx === 'relight') { q.rings[a.ring] = true; if (q.out) { q.out = false; say(S, `${q.name} is back in`); } say(S, `${p.name} relights ${q.name}'s ${RINGS[a.ring]} ring`); reap(S, q, 1); }

    if (d.cell.down) { trapHit(S, p, q, d, [f]); return after(S); }
    const A = atk(S, p, f.cell), D = Dof(d.cell);

    if (A < D && S.cfg.dmgStays) d.cell.dmg = (d.cell.dmg || 0) + A;
    if (A >= D) knock(S, q, d.sq);          // show: higher stays, a tie takes both
    if (A <= D) knock(S, p, f.sq);
    return after(S);
  }
  if (a.t === 'gang') {
    const cells = a.lanes.split('').map(l => front(p, +l)), q = S.players[a.tp], d = front(q, a.at); cells.forEach(f => f.cell.attacked = true);

    const A = cells.reduce((s, f) => s + atk(S, p, f.cell), 0), D = Dof(d.cell);
    say(S, `${p.name}'s ${cells.map(f => card(f.cell).name).join(' + ')} (A ${A} together) attack ${q.name}'s ${card(d.cell).name} (D ${D})`);
    if (A < D && S.cfg.dmgStays) d.cell.dmg = (d.cell.dmg || 0) + A;
    if (A >= D) knock(S, q, d.sq);
    if (A <= D) for (const f of cells) knock(S, p, f.sq);

  }
  if (a.t === 'buywin') { const price = winPrice(S, p); p.econ -= price; say(S, `${p.name} pays ${price} ECON and buys the win`); return finish(S, { type: 'win', team: p.team, how: 'econ' }); }

    const q = a.tp !== undefined ? S.players[a.tp] : null;

      if (!q.canopy && rings.length >= lit(q) && bigOptions(S, q).some(b => b.tp === p.id && (b.big === 'broadside' || b.big === 'audit'))) { S.pending = { responder: q.id, from: p.id, move: a }; say(S, `${p.name} calls ${a.big.toUpperCase()} on ${q.name}'s last rings. ${q.name} may answer.`); return; }
      p.cmd.used = true; say(S, `${p.name}: ${a.big.toUpperCase()}`); past(S, q, rings, a.big.toUpperCase()); return after(S);
    }
    p.cmd.used = true; say(S, `${p.name}: ${a.big.toUpperCase()}`);
    if (a.big === 'multiply') { const src = p.grid[a.sq]; let k = 0; const r0 = a.sq - a.sq % 3; [r0, r0 + 1, r0 + 2].forEach(i => { if (!p.grid[i]) { p.grid[i] = { uid: S.uid++, card: src.card, attacked: true, charge: 0 }; k++; } }); say(S, `${card(src).name} becomes ${k} more`); }
    if (a.big === 'canopy') p.canopy = true;
    if (a.big === 'holyleague') p.league = true;
    if (a.big === 'moodpink') p.pink = true;
    if (a.big === 'parlay') p.parlay = q.id;   // q cannot attack p until p's next turn
    return;
  }
}

function resolveClash(S, a) {
  const pd = S.pending, p = S.players[pd.from], q = S.players[pd.responder]; S.pending = null; S.active = true;
  const r1 = bigDamage(S, p, pd.move); p.cmd.used = true;
  if (a.t === 'pass') { say(S, `${p.name}: ${pd.move.big.toUpperCase()}`); past(S, q, r1, pd.move.big.toUpperCase()); return after(S); }
  const r2 = bigDamage(S, q, a); q.cmd.used = true;
  say(S, `SAME FRAME: ${p.name}'s ${pd.move.big.toUpperCase()} and ${q.name}'s ${a.big.toUpperCase()}`);
  past(S, q, r1, pd.move.big.toUpperCase());
  past(S, p, r2, a.big.toUpperCase());
  return after(S);
}

function after(S) {
  if (S.result) return;
  const teams = [...new Set(living(S).map(p => p.team))];
  if (teams.length === 1) finish(S, { type: 'win', team: teams[0] });
  else if (teams.length === 0) finish(S, { type: 'bothLose' });           // MOOK: you blew each other up, you both lose
  else if (S.players[S.cur].out && !S.pending) nextPlayer(S);
}
function finish(S, r) { S.result = r; say(S, 'RESULT ' + JSON.stringify(r)); }

function endTurn(S) {

// The price list is NOT typed in by hand. It is FITTED to the cards the game already has (least squares):
//   cost ≈ a·A + d·D + e·DEV + k      over the plain fighting cards of the six first decks.
// A new card is then priced by the same line, plus a fixed price for each keyword it carries (KEYWORDS: Claude's numbers).
// Actions, traps and commanders have no line to sit on: they are judged by the sweep only (balance.js).
'use strict';
const { C } = require('./cards.js');

// keyword → what it means on the table, and what it adds to the fair cost (INV: every price here is Claude's)
const KEYWORDS = {
  runner:  { price: 1,   text: 'Runner: may attack ANY empty enemy lane, not only its own' },
  anylane: { price: 1.5, text: 'Reach: may attack any lane of any enemy' },
  income:  { price: 1,   text: 'Income: pays ECON at the start of your turn' },
  smite:   { price: 3,   text: 'Papal Smite: after a full turn on the grid, puts out one enemy ring' },
  science: { price: 0,   text: 'Science: grows in Rose\'s hands' },
};
const kwOf = c => [...(c.tags || []).filter(t => KEYWORDS[t]), ...(c.income ? ['income'] : []), ...(c.move === 'smite' ? ['smite'] : [])];

  const n = v.length, A = M.map((r, i) => [...r, v[i]]);

  return { fair: Math.round(fair * 10) / 10, diff: Math.round(diff * 10) / 10, verdict: diff < -1 ? 'cheap' : diff > 1 ? 'dear' : 'fair' };
