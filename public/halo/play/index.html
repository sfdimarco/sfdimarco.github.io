function newMatch(seed, players, config) { return { seed, players, config: Object.assign({}, config || {}), moves: [] }; }

function start(match) {
  const cfg = Object.assign({}, DEFAULTS, match.config);
  const r = rng(match.seed);
  const S = { cfg, r, players: [], cur: 0, turnNo: 0, pending: null, offer: null, quiet: 0, active: false, result: null, log: [], uid: 1, stats: { handAtEnd: [], firstBlood: null, drawn: {} } };
  match.players.forEach((p, i) => {
    const d = DECKS[p.deck];
    const pl = { id: i, name: p.name, team: p.team, seat: i, deckKey: p.deck,
      rings: RINGS.map((_, k) => k < cfg.rings), grid: Array(9).fill(null), hand: [], deck: shuffle(buildDeck(p.deck, cfg), r), relit: 0,
      cmd: { id: d.commander, where: 'shoulder', used: false }, econ: 0, devPool: 0, out: false,
      canopy: false, pink: false, parlay: null, league: false };
    for (let k = 0; k < cfg.handStart && pl.deck.length; k++) pl.hand.push(pl.deck.pop());
    S.players.push(pl); S.stats.drawn[i] = 0;
  });
  if (Array.isArray(cfg.secondEcon)) S.players.forEach((pl, i) => { pl.econ = cfg.secondEcon[i] || 0; });   // one number per seat
  else if (cfg.secondEcon) for (const pl of S.players) if (pl.team !== S.players[0].team) pl.econ = cfg.secondEcon;
  S.order = S.players.map(p => p.id);
  if (cfg.order === 'team') S.order.sort((a, b) => (S.players[a].team < S.players[b].team ? -1 : S.players[a].team > S.players[b].team ? 1 : a - b));
  S.oi = 0; S.cur = S.order[0];
  beginTurn(S);
  return S;
}

const lit = p => p.rings.filter(Boolean).length;
const say = (S, t) => S.log.push(`t${S.turnNo} ${t}`);
const card = cell => C[cell.card];
function front(p, lane) { for (let r = 0; r < 3; r++) { const c = p.grid[r * 3 + lane]; if (c) return { cell: c, sq: r * 3 + lane }; } return null; }
const atk = (S, p, cell) => cell.down ? 0 : card(cell).A + (card(cell).A > 0 ? (cell.up || 0) : 0) + (p.league && card(cell).type !== 'structure' && card(cell).A > 0 ? 2 : 0);
const Dof = cell => cell.down ? 0 : Math.max(0, card(cell).D + (cell.up || 0) - (cell.dmg || 0));   // v1: growth and damage that stays
const costOf = (S, id) => id === 'barrage' ? S.cfg.barrageCost : (C[id].econ || 0);
const RELIGION = RINGS.indexOf('religion');
const living = S => S.players.filter(p => !p.out);
const enemies = (S, p) => S.players.filter(q => !q.out && q.team !== p.team);
// 2026-11-22 dial ringCap: a planet can lose only this many rings between two of its own turns (so nobody is stripped before they can answer)
const ECONOMY = 0, SCIENCE = 2, FOOD = 3, POP = 4;
// 11-22 night, the POPULATION road · THE CROWD: units (not walls, machines or traps; not your commander) on your squares. crowdWin of them, still there at the
// start of your next turn with your Population ring lit, wins. The answer: knock one out, or put out their Population ring.
// 11-22 night, the POLITICS road · THE TREATY: an Envoy seals a treaty with one rival. Hold a treaty with every living rival at the start of your turn,
// Politics ring lit: you win. A rival tears up its treaty with you by aiming any move at you. Peace is the politician's weapon; war is the answer.
const POLITICS = 6;
// polWin = how many treaties you need at once (never more than the rivals still in): 1 on 1 that is one; at a big table it is a few, not all
const treaties = (S, p) => enemies(S, p).filter(q => (p.seals || []).includes(q.id)).length;
const sealedAll = (S, p) => { const en = enemies(S, p); return en.length > 0 && treaties(S, p) >= Math.min(en.length, S.cfg.polWin || en.length); };
const crowd = p =>p.grid.filter(c => c && !c.down && !c.isCmd && card(c).type === 'unit').length;
const roadOf = p => DECKS[p.deckKey] && DECKS[p.deckKey].road;   // the ring a deck's behaviour lands on (kits.js), for the road perks
// 11-22 night, the FOOD road · THE HARVEST: every ring that relights on your planet is reaped (growth, Spring, Lichen, SNOOZE …), while your Food ring is lit.
// Reap harvestWin and you win at the start of your next turn, if your Food ring is still lit. The answer: put out their Food ring.
function reap(S, p, n) {
  if (!S.cfg.harvestWin || n <= 0 || p.out || !p.rings[FOOD]) return;
  if (S.cfg.harvestTurn) { if (p.reaped === S.turnNo) return; p.reaped = S.turnNo; n = 1; }   // one harvest a turn, however many rings come back: a burst of relight cards was a cliff (one Lichen moved Mush 5 % → 40 %)
  const was = p.harvest || 0; p.harvest = was + n;
  if (was < S.cfg.harvestWin && p.harvest >= S.cfg.harvestWin) say(S, `${p.name}'s HARVEST IS IN: put out ${p.name}'s Food ring before ${p.name}'s next turn`);
}
const ringOK = (S, p, k) => !S.cfg.ringsMatter || p.rings[k];
const baseId = id => id && id.replace(/_b$/, '');
const machine = c => card(c).tags.includes('part') || card(c).tags.includes('core');
const capped = (S, p) => !!S.cfg.ringCap && (p.lost || 0) >= S.cfg.ringCap;
// a card that pays its owner ECON every turn (Balistrai pays only Rose, as before)
const pays = (S, p, c) => !!c && !c.down && !!card(c).income && ((S.cfg.roseV1 && p.deckKey === 'rose') || !!card(c).lib);
const market = (S, p) => p.grid.some(c => pays(S, p, c));
const winPrice = (S, p) => S.cfg.econWin * (S.cfg.noMarket > 1 && !market(S, p) ? S.cfg.noMarket : 1);   // the ECON road is BUILT: a market on your grid, or you pay noMarket times the price
const whole = (S, p) => p.grid.every((c, i) => c && !c.down && card(c).tags.includes(i === 4 ? 'core' : 'part'));

function beginTurn(S) {
  const p = S.players[S.cur]; S.turnNo++; S.active = false;
  p.canopy = false; p.pink = false; p.parlay = null; p.league = false; p.lost = 0;       // "until your next turn" effects end
  for (const c of p.grid) if (c) { c.attacked = false; if (c.frozen) c.frozen--; if (card(c).move === 'smite') c.charge = Math.min(2, (c.charge || 0) + 1); }
  if (S.cfg.harvestWin && (p.harvest || 0) >= S.cfg.harvestWin && p.rings[FOOD]) { say(S, `${p.name} brings in the harvest`); return finish(S, { type: 'win', team: p.team, how: 'food' }); }
  if (S.cfg.polWin && p.rings[POLITICS] && sealedAll(S, p)) { say(S, `${p.name} holds its treaties: the table is at peace on ${p.name}'s terms`); return finish(S, { type: 'win', team: p.team, how: 'politics' }); }
  if (S.cfg.crowdWin) { const full =crowd(p) >= S.cfg.crowdWin && p.rings[POP]; p.crowdCount = full ? (p.crowdCount || 0) + 1 : 0;   // crowdHold: how many of your turns it must start full
    if (full && p.crowdCount >= (S.cfg.crowdHold || 1)) { say(S, `${p.name}'s crowd fills the planet`); return finish(S, { type: 'win', team: p.team, how: 'pop' }); } }
  const life = S.cfg.ringsMode === 'life', rose =S.cfg.roseV1 && (p.deckKey === 'rose' || (DECKS[p.deckKey] && DECKS[p.deckKey].road === 'science'));   // 11-22 night: the science road's perks go to any science-road deck (kits.js)
  if (S.cfg.relWin) { const conv = p.rings[RELIGION] && enemies(S, p).length && enemies(S, p).every(q => !q.rings[RELIGION]); p.relCount = conv ? (p.relCount || 0) + 1 : 0;
    if (conv && p.relCount >= S.cfg.relWin) { say(S, `${p.name}'s Religion ring is the only one lit: the table is converted`); return finish(S, { type: 'win', team: p.team, how: 'religion' }); }
    if (conv) say(S, `${p.name} is CONVERTING THE TABLE: put out ${p.name}'s Religion ring or relight your own before ${p.name}'s next turn`); }
  if (S.cfg.techWin && S.cfg.techHold) { const up = whole(S, p) && ringOK(S, p, SCIENCE);   // the machine has to stand a whole round
    if (up && p.whole) { say(S, `${p.name}'s great machine still stands: it starts`); return finish(S, { type: 'win', team: p.team, how: 'tech' }); }
    if (up) say(S, `${p.name}'s GREAT MACHINE IS WHOLE: break a piece or put out ${p.name}'s Science ring before ${p.name}'s next turn`);
    p.whole = up; }
  if (rose && ringOK(S, p, SCIENCE)) for (const c of p.grid) if (c && !c.down && card(c).tags.includes('science')) c.up = Math.min(S.cfg.upgradeCap, (c.up || 0) + 1);
  const n = (life || S.cfg.draw !== 'ring' ? S.cfg.drawFixed : Math.max(lit(p), S.cfg.floorDraw)) + (rose ? 1 : 0) + (ringOK(S, p, SCIENCE) ? p.grid.filter(c => c && !c.down && card(c).tags.includes('lab')).length : 0);
  let got = 0; for (let k = 0; k < n && (!S.cfg.handCap || p.hand.length < S.cfg.handCap); k++) {
    if (!p.deck.length && S.cfg.reshuffle && p.discard && p.discard.length) { p.deck = shuffle(p.discard, S.r); p.discard = []; say(S, `${p.name}'s deck is empty: ${p.deck.length} lost cards are shuffled into a new one`); }
    if (!p.deck.length) break; p.hand.push(p.deck.pop()); got++; }
  S.stats.drawn[p.id] += got; if (got) S.active = true;
  p.econ = (S.cfg.keepEcon ? p.econ : 0) + (life ? S.cfg.econFixed : S.cfg.econ === 'ring' ? Math.max(lit(p), S.cfg.floorEcon) : (p.rings[0] ? S.cfg.econLit : S.cfg.econDark));
  if (ringOK(S, p, ECONOMY)) p.econ += p.grid.reduce((s, c) => s + (pays(S, p, c) ? card(c).income : 0), 0);
  if (S.cfg.dev === 'income') p.econ += Math.floor(devSum(p) / S.cfg.devPer);
  say(S, `${p.name} draws ${got}, has ${p.econ} ECON`);
}
const devSum = p => p.grid.reduce((s, c) => s + (c ? (card(c).dev || 0) : 0), 0);

// who can player p's lane hit?  → [{ tp, lane }]
function targets(S, p, lane, any) {
  const en = enemies(S, p).filter(q => q.parlay !== p.id);
  if (any) return en.flatMap(q => [0, 1, 2].map(l => ({ tp: q.id, lane: l })));
  if (S.cfg.target === 'numbers' || lane === 1) return en.map(q => ({ tp: q.id, lane }));
  // neighbours (INV): left lane (0) → the next planet on your left, right lane (2) → on your right. Blank and out planets are skipped;
  // if the first live planet that way is a team-mate, that side is quiet.
  const dir = lane === 0 ? -1 : 1, N = 7;
  for (let k = 1; k < N; k++) { const seat = ((p.seat + dir * k) % N + N) % N; const q = S.players.find(x => x.seat === seat && !x.out); if (!q) continue; return q.team !== p.team && q.parlay !== p.id ? [{ tp: q.id, lane: 2 - lane }] : []; }
  return [];
}

function legal(S) {
  if (S.result) return [];
  if (S.pending) { const o = [{ t: 'pass' }]; return o.concat(bigOptions(S, S.players[S.pending.responder]).filter(b => b.tp === S.pending.from).map(b => Object.assign({}, b, { t: 'answer' }))); }
  const p = S.players[S.cur], o = [];
  const peace = S.turnNo <= S.cfg.peace * S.players.length;
  const empty = p.grid.map((c, i) => c ? -1 : i).filter(i => i >= 0);
  for (const id of new Set(p.hand)) {
    const cd = C[id]; if (costOf(S, id) > p.econ) continue;
    if (cd.type === 'action') {
      if (peace && (cd.fx === 'barrage' || cd.fx === 'takeover' || cd.fx === 'pollen' || cd.fx === 'siege' || cd.fx === 'smash')) continue;
      if (cd.fx === 'absorb') o.push({ t: 'play', card: id });
      if (cd.fx === 'seed' && !p.rings[FOOD] && FOOD < S.cfg.rings) o.push({ t: 'play', card: id });   // 🗣 11-22 night (his pick B): a Food-only relight
      if ((cd.fx === 'snooze' || cd.fx === 'spring' || cd.fx === 'sprout') && p.rings.some((on, k) => !on && k < S.cfg.rings)) o.push({ t: 'play', card: id });
      if (cd.fx === 'smash') for (const q of enemies(S, p)) if (!capped(S, q)) o.push({ t: 'play', card: id, tp: q.id });
      if (cd.fx === 'siege') for (const q of enemies(S, p)) for (let l = 0; l < 3; l++) { const f = front(q, l); if (f && !q.pink && !f.cell.down && Dof(f.cell) >= S.cfg.siegeD) o.push({ t: 'play', card: id, tp: q.id, lane: l }); }
      if (cd.fx === 'gain3' || cd.fx === 'gain2') o.push({ t: 'play', card: id });
      if (cd.fx === 'barrage') for (const q of enemies(S, p)) for (let l = 0; l < 3; l++) { const f = front(q, l); if (f && !q.pink && Dof(f.cell) <= S.cfg.barrageD) o.push({ t: 'play', card: id, tp: q.id, lane: l }); }
      if (cd.fx === 'envoy' && !peace) for (const q of enemies(S, p)) if (!(p.seals || []).includes(q.id)) o.push({ t: 'play', card: id, tp: q.id });   // not in the peace round: the rival must get a turn to answer
      if (cd.fx === 'sigil') { if (!peace) for (const q of enemies(S, p)) if (q.rings[RELIGION] && !capped(S, q)) o.push({ t: 'play', card: id, tp: q.id }); }
      if (cd.fx === 'takeover') for (const q of enemies(S, p)) if (q.rings[0] && !capped(S, q)) o.push({ t: 'play', card: id, tp: q.id });
      if (cd.fx === 'pollen') for (const q of enemies(S, p)) if (!capped(S, q)) q.rings.forEach((on, k) => { if (on) o.push({ t: 'play', card: id, tp: q.id, ring: k }); });
      if (cd.fx === 'relight') for (const q of S.players) if (q.team === p.team && (!q.out || q.cmd.where !== 'out')) q.rings.forEach((on, k) => { if (!on && k < S.cfg.rings) o.push({ t: 'play', card: id, tp: q.id, ring: k }); });
    } else { for (const sq of empty) o.push({ t: 'play', card: id, sq });
      // 11-22: a machine piece may be BUILT OVER one of your own cards (the nine squares are otherwise full long before the machine is)
      if (S.cfg.techWin && S.cfg.lib && (cd.tags.includes('part') || cd.tags.includes('core'))) p.grid.forEach((c, sq) => { if (c && !c.isCmd && !machine(c)) o.push({ t: 'play', card: id, sq }); }); }
  }
  if (p.cmd.where === 'shoulder') for (const sq of empty) o.push({ t: 'deploy', sq });
  for (let lane = 0; lane < 3 && !peace; lane++) {
    const f = front(p, lane); if (!f || f.cell.attacked || f.cell.frozen || atk(S, p, f.cell) <= 0) continue;
    const tgs = targets(S, p, lane, card(f.cell).tags.includes('anylane'));
    if (card(f.cell).tags.includes('runner')) for (const q of enemies(S, p)) if (q.parlay !== p.id) for (let l = 0; l < 3; l++) if (!front(q, l) && !tgs.some(t => t.tp === q.id && t.lane === l)) tgs.push({ tp: q.id, lane: l });   // runner: any EMPTY enemy lane
    for (const tg of tgs) {
      const q = S.players[tg.tp], d = front(q, tg.lane);
      if (d) { if (!q.pink) o.push({ t: 'attack', lane, tp: q.id, at: tg.lane }); }
      else if (!capped(S, q)) q.rings.forEach((on, k) => { if (on) o.push({ t: 'attack', lane, tp: q.id, at: tg.lane, ring: k }); });
    }
  }
  if (S.cfg.gang && !peace) {   // v1 wall-breaker 2 (INV): ganging cards may all hit the same enemy lane
    const ok = [0, 1, 2].filter(l => { const f = front(p, l); return f && !f.cell.attacked && !f.cell.frozen && atk(S, p, f.cell) > 0; });
    const sets = []; for (let i = 0; i < ok.length; i++) for (let j = i + 1; j < ok.length; j++) sets.push('' + ok[i] + ok[j]); if (ok.length === 3) sets.push('012');
    for (const lanes of sets) for (const q of enemies(S, p)) if (q.parlay !== p.id && !q.pink) for (let l = 0; l < 3; l++) if (front(q, l)) o.push({ t: 'gang', lanes, tp: q.id, at: l });
  }
  if (S.cfg.econWin && p.econ >= winPrice(S, p) && ringOK(S, p, ECONOMY)) o.push({ t: 'buywin' });
  if (!peace) p.grid.forEach((c, sq) => { if (c && card(c).move === 'smite' && (c.charge || 0) >= 2 && !c.attacked) for (const q of enemies(S, p)) if (!capped(S, q)) q.rings.forEach((on, k) => { if (on) o.push({ t: 'smite', sq, tp: q.id, ring: k }); }); });
  if (!peace) for (const b of bigOptions(S, p)) o.push(b);
  if (!S.offer) o.push({ t: 'offer' });
  else if (S.offer.from !== p.id && S.players[S.offer.from].team !== p.team && !S.offer.yes.includes(p.id)) o.push({ t: 'accept' });
  o.push({ t: 'end' });
  return o;
}

function bigOptions(S, p) {
  const o = []; if (p.out || p.cmd.used || p.cmd.where === 'out') return o;
  const big = C[p.cmd.id].big, en = enemies(S, p);
  const count = tag => p.grid.filter(c => c && card(c).tags.includes(tag)).length;
  if (big === 'broadside' && count('ship')) for (const q of en) if (!capped(S, q)) q.rings.forEach((on, k) => { if (on) o.push({ t: 'big', big, tp: q.id, ring: k }); });
  if (big === 'audit' && count('auditor')) for (const q of en) if (!capped(S, q)) o.push({ t: 'big', big, tp: q.id });
  if (big === 'canopy' || big === 'holyleague' || big === 'moodpink') o.push({ t: 'big', big });
  if (big === 'parlay') for (const q of en) o.push({ t: 'big', big, tp: q.id });
  if (big === 'multiply') p.grid.forEach((c, sq) => { const r = sq - sq % 3; if (c && !c.isCmd && !c.down && [r, r + 1, r + 2].some(i => !p.grid[i])) o.push({ t: 'big', big, sq }); });
  return o;
}

// a rival that really HURTS a planet it has a treaty with (a ring put out, a card knocked out) tears the treaty up
function tear(S, p) { const a = S.players[S.cur]; if (a && a.team !== p.team && (p.seals || []).includes(a.id)) { p.seals = p.seals.filter(i => i !== a.id); say(S, `${a.name} tears up the treaty with ${p.name}`); } }
function knock(S, p, sq) { // a card leaves the table
  const c = p.grid[sq]; p.grid[sq] = null; if (!c) return; tear(S, p);
  if (!c.isCmd && S.cfg.reshuffle && !C[c.card].tags.includes('anylane-fused')) (p.discard = p.discard || []).push(c.card);
  if (c.isCmd) { p.cmd.where = 'out'; say(S, `${p.name}'s commander ${C[c.card].name} is knocked out: ${p.name} is OUT`); putOut(S, p); } // MOOK: lose your commander, you are out
}
function putOut(S, p) { if (p.out) return; p.out = true; p.grid.fill(null); if (p.cmd.where === 'grid') p.cmd.where = 'shoulder'; } // a planet gone dark sends its commander back to the shoulder (found in playtest 1)
function dark(S, p, k, why) {
  if (p.canopy) { say(S, `${p.name}'s canopy holds (${why})`); return false; }
  if (!p.rings[k]) return false;
  if (capped(S, p)) { say(S, `${p.name}'s halo holds: ${S.cfg.ringCap} rings is all it can lose before its next turn (${why})`); return false; }
  const tr = p.grid.findIndex(c => c && c.down && card(c).trig === 'ringdark');
  if (tr >= 0) { const a = S.players[S.cur]; p.grid[tr] = null; say(S, `${p.name}'s face-down card flips: BRUMATION. Snow. The ${RINGS[k]} ring stays lit (${why})`);
    if (a.team !== p.team) for (let l = 0; l < 3; l++) { const f = front(a, l); if (f) f.cell.frozen = 2; } return false; }
  p.rings[k] = false; p.lost = (p.lost || 0) + 1; say(S, `${p.name}'s ${RINGS[k]} ring goes dark (${why})`); tear(S, p);
  if (!S.stats.firstBlood) S.stats.firstBlood = S.players[S.cur].team;
  if (S.cfg.spoils) { const a = S.players[S.cur]; if (a.team !== p.team && !a.out) {
    if (S.cfg.spoils === 'econ') a.econ++;
    else if (!S.cfg.handCap || a.hand.length < S.cfg.handCap) { if (!a.deck.length && S.cfg.reshuffle && a.discard && a.discard.length) { a.deck = shuffle(a.discard, S.r); a.discard = []; } if (a.deck.length) a.hand.push(a.deck.pop()); } } }
  if (lit(p) === 0) { say(S, `${p.name}'s planet goes quiet: OUT`); putOut(S, p); }
  return true;
}
// v1: a move that goes past the grid. A face-down trap that says "past the grid" stops all of it (call C).
function past(S, q, rings, why) {
  const tr = q.grid.findIndex(c => c && c.down && card(c).trig === 'pastgrid');
  if (tr >= 0) { say(S, `${q.name}'s face-down card flips: ${card(q.grid[tr]).name} stops ${why}`); q.grid[tr] = null; return; }
  for (const k of rings) dark(S, q, k, why);
}
function trapHit(S, p, q, d, cells) {   // an attack lands on a face-down card
  const t = card(d.cell);
  if (t.trig === 'attacked') { say(S, `${q.name}'s face-down card flips: ${t.name}. What attacked falls in`); q.grid[d.sq] = null; for (const f of cells) knock(S, p, f.sq); }
  else { say(S, `${q.name}'s face-down ${t.name} is knocked out before its moment`); q.grid[d.sq] = null; }
}
function auditRings(S, p, q) { const n = Math.min(S.cfg.auditCap, p.grid.filter(c => c && card(c).tags.includes('auditor')).length); return q.rings.map((on, k) => on ? k : -1).filter(k => k >= 0).slice(0, n); }
function bigDamage(S, p, a) { const q = S.players[a.tp]; return a.big === 'broadside' ? [a.ring] : a.big === 'audit' ? auditRings(S, p, q) : []; }

function checkCombos(S, p) {
  const L = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
  for (const co of COMBOS) for (const l of L) {
